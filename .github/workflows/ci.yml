name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: the supabase package's postinstall downloads a
      # CLI binary that none of these checks need.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check (includes test/types tenancy enforcement)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
